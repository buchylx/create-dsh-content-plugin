name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify (version + tests)
        run: |
          node src/cli.js --version
          npm test

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Setting repository topics needs `administration` (repo admin), which the
      # default GITHUB_TOKEN cannot be granted — that permission is unsupported,
      # and requesting it makes the whole workflow fail to start (0 jobs).
      # Keep this best-effort and non-fatal so it never blocks a published
      # release. To actually apply topics, pass a PAT with repo scope via a
      # secret and add `github-token: ${{ secrets.TOPIC_TOKEN }}` below.
      - name: Add dsh-plugin topic tag (best-effort)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: ['dsh-plugin', 'deepseek-harness', 'content-automation', 'crosspost'],
            })
