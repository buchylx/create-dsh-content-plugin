name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify (version + tests)
        run: |
          node src/cli.js --version
          npm test

      - name: Publish to npm (skip if already published)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view create-dsh-content@$V version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "create-dsh-content@$V already published — skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Setting repository topics needs `administration` (repo admin), which the
      # default GITHUB_TOKEN cannot be granted — that permission is unsupported,
      # and requesting it makes the whole workflow fail to start (0 jobs).
      # So this step is best-effort and non-fatal (never blocks a release).
      # To ACTUALLY apply topics, create a PAT with the `repo` scope (classic) or
      # the `Administration: write` repo permission (fine-grained), add it as a
      # repo secret named TOPIC_TOKEN; the fallback below picks it up. Without it
      # the call returns 403 and is safely ignored.
      - name: Add dsh-plugin topic tag (best-effort)
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOPIC_TOKEN || github.token }}
          script: |
            await github.rest.repos.replaceAllTopics({
              owner: context.repo.owner,
              repo: context.repo.repo,
              names: ['dsh-plugin', 'deepseek-harness', 'content-automation', 'crosspost'],
            })
