name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify (version + tests)
        run: |
          node src/cli.js --version
          npm test

      - name: Publish to npm (skip if already published)
        run: |
          V=$(node -p "require('./package.json').version")
          if npm view create-dsh-content@$V version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "create-dsh-content@$V already published — skipping."
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
