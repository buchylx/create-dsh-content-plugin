# Release pipeline for the generated plugin — wired in by create-dsh-content
# (included only when generated with --with-ci, the default).
# On a `v*` tag push it type-checks + builds, then publishes the plugin to npm.
# Requires an `NPM_TOKEN` secret in the repo settings.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm install

      - name: Type-check & build
        run: |
          npm run typecheck
          npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
